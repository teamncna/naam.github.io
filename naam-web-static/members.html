<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Members — NAAM</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
    <script src="common.js"></script>
    <script src="theme.js"></script>
    <script src="nav.js"></script>
    <script>
      requireLogin();
    </script>
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container page-content">
      <section class="panel">
        <div class="panel-header">
          <h2>Members</h2>
          <div class="controls">
            <div class="search-group">
              <div class="search-container">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input
                  id="search"
                  placeholder="Search name, city, native place..."
                />
              </div>
              <button id="searchBtn" class="btn subtle" type="button">
                Search
              </button>
            </div>
            <select id="limit">
              <option value="10">10 / page</option>
              <option value="20" selected>20 / page</option>
              <option value="50">50 / page</option>
            </select>
          </div>
        </div>

        <div class="filters filters-secondary">
          <select id="categorySelect">
            <option value="">Filter by…</option>
            <option value="City">City</option>
            <option value="Chettinad native place">Native Village</option>
            <option value="Kovil">Kovil</option>
            <option value="YearSince">Year Since</option>
          </select>

          <select id="subCategorySelect" disabled>
            <option value="">Select value</option>
          </select>

          <button id="clearFilterBtn" class="btn subtle small hidden" type="button">
            Clear filter
          </button>
        </div>

        <div id="list" class="member-list"></div>

        <div class="pagination">
          <button id="prev" class="btn subtle">Previous</button>
          <span id="pageInfo" class="muted small"></span>
          <button id="next" class="btn subtle">Next</button>
        </div>
      </section>
    </main>

    <div id="app-footer"></div>

    <script>
      renderHeader("members");
      renderFooter();

      const searchInput = document.getElementById("search");
      const listEl = document.getElementById("list");
      const limitEl = document.getElementById("limit");
      const searchBtn = document.getElementById("searchBtn");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const pageInfo = document.getElementById("pageInfo");
      const categorySelect = document.getElementById("categorySelect");
      const subCategorySelect = document.getElementById("subCategorySelect");
      const clearFilterBtn = document.getElementById("clearFilterBtn");

      // Maps a dropdown category to the /stats/:key endpoint and the raw
      // member field it corresponds to (same convention the old
      // browse_by_category.html page used, now folded into this page).
      const CATEGORY_MAP = {
        City: "city",
        "Chettinad native place": "native-village",
        Kovil: "kovil",
        YearSince: "year",
      };

      let page = 1;
      let activeFilter = null; // { category, value }

      async function loadMembers() {
        const limit = Number(limitEl.value);

        // Category filtering needs to match across the whole dataset, not
        // just whatever page the plain search endpoint happens to return —
        // so when a filter is active, fetch everything once and paginate
        // client-side instead of relying on server-side pagination.
        if (activeFilter) {
          listEl.innerHTML = `<div class="loading">Loading members…</div>`;
          try {
            const res = await apiFetch(`/members?limit=1000`);
            const all = await res.json();
            const search = searchInput.value.trim().toLowerCase();
            const filtered = all.filter((m) => {
              const matchesCategory =
                (m[activeFilter.category] || "").toString().toLowerCase() ===
                activeFilter.value.toLowerCase();
              if (!matchesCategory) return false;
              if (!search) return true;
              const fullName = `${m["First name"] || ""} ${
                m["Last name"] || ""
              }`.toLowerCase();
              const email = (m.Email || "").toLowerCase();
              return fullName.includes(search) || email.includes(search);
            });

            const start = (page - 1) * limit;
            const pageItems = filtered.slice(start, start + limit);
            renderList(pageItems);
            pageInfo.textContent = `Page ${page} • ${filtered.length} result(s)`;
            prevBtn.disabled = page === 1;
            nextBtn.disabled = start + limit >= filtered.length;
          } catch (err) {
            listEl.innerHTML = `<div class="error">Failed to load members</div>`;
            console.error(err);
          }
          return;
        }

        const search = encodeURIComponent(searchInput.value.trim());
        const url = `/members?search=${search}&page=${page}&limit=${limit}`;
        listEl.innerHTML = `<div class="loading">Loading members…</div>`;
        try {
          const res = await apiFetch(url);
          const members = await res.json();
          renderList(members);
          pageInfo.textContent = `Page ${page} • ${members.length} result(s)`;
          prevBtn.disabled = page === 1;
          nextBtn.disabled = members.length < Number(limit);
        } catch (err) {
          listEl.innerHTML = `<div class="error">Failed to load members</div>`;
          console.error(err);
        }
      }

      function renderList(items) {
        if (!items || items.length === 0) {
          listEl.innerHTML = `<div class="empty">No results. Try a different search.</div>`;
          return;
        }
        listEl.innerHTML = "";
        items.forEach((item) => {
          const id = item._id;
          const name = (
            (item["First name"] || "") +
            " " +
            (item["Last name"] || "")
          ).trim();
          const spouse = (
            (item["Spouse first name"] || "") +
            " " +
            (item["Spouse last name"] || "")
          ).trim();
          const city = item.City || "";
          const nativep = item["Chettinad native place"] || "";
          const el = document.createElement("a");
          el.className = "member-row";
          el.href = `member.html?id=${encodeURIComponent(id)}`;
          el.innerHTML = `
          <img class="avatar-photo loading" src="${getPhotoUrl(item)}" onload="this.classList.remove('loading')" onerror="this.classList.remove('loading'); this.src='assets/default-profile.jpeg'" alt="" />
          <div class="meta">
            <div class="name">${escapeHtml(
              name || item.Email || "Unnamed"
            )}</div>
            <div class="sub muted">${escapeHtml(
              spouse ? "Spouse: " + spouse : city || nativep
            )}</div>
          </div>
          <div class="chev">›</div>
        `;
          listEl.appendChild(el);
        });
      }

      // Populate the subcategory dropdown with distinct values for the
      // chosen category, fetched from /stats/:key.
      async function loadSubCategories(preselectValue) {
        const selectedCategory = categorySelect.value;
        if (!selectedCategory) {
          subCategorySelect.innerHTML = '<option value="">Select value</option>';
          subCategorySelect.disabled = true;
          activeFilter = null;
          clearFilterBtn.classList.add("hidden");
          page = 1;
          loadMembers();
          return;
        }

        try {
          const apiCategory = CATEGORY_MAP[selectedCategory];
          const res = await apiFetch(`/stats/${apiCategory}`);
          const stats = await res.json();
          const uniqueValues = stats
            .map((item) => item._id)
            .filter(Boolean)
            .sort();

          subCategorySelect.innerHTML =
            '<option value="">Select value</option>' +
            uniqueValues
              .map((v) => `<option value="${v}">${v}</option>`)
              .join("");
          subCategorySelect.disabled = false;

          if (preselectValue) {
            const match = uniqueValues.find(
              (v) => String(v).toLowerCase() === String(preselectValue).toLowerCase()
            );
            if (match) subCategorySelect.value = match;
          }

          applySelectedFilter();
        } catch (err) {
          console.error("Failed to fetch subcategories", err);
          subCategorySelect.innerHTML = '<option value="">Error loading</option>';
          subCategorySelect.disabled = true;
        }
      }

      function applySelectedFilter() {
        const category = categorySelect.value;
        const value = subCategorySelect.value;
        if (category && value) {
          activeFilter = { category, value };
          clearFilterBtn.classList.remove("hidden");
        } else {
          activeFilter = null;
          clearFilterBtn.classList.add("hidden");
        }
        page = 1;
        loadMembers();
      }

      // Deep-link from an analytics chart click: ?category=City&value=Fremont
      function applyLinkFromAnalytics() {
        const params = new URLSearchParams(location.search);
        const category = params.get("category");
        const value = params.get("value");
        if (!category || !(category in CATEGORY_MAP)) return false;

        categorySelect.value = category;
        loadSubCategories(value);
        return true;
      }

      categorySelect.addEventListener("change", () => loadSubCategories());
      subCategorySelect.addEventListener("change", applySelectedFilter);
      clearFilterBtn.addEventListener("click", () => {
        categorySelect.value = "";
        loadSubCategories();
      });

      // listeners
      searchBtn.addEventListener("click", () => {
        page = 1;
        loadMembers();
      });
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          page = 1;
          loadMembers();
        }
      });
      limitEl.addEventListener("change", () => {
        page = 1;
        loadMembers();
      });
      prevBtn.addEventListener("click", () => {
        if (page > 1) {
          page--;
          loadMembers();
        }
      });
      nextBtn.addEventListener("click", () => {
        page++;
        loadMembers();
      });

      // simple escape
      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }

      // initial
      if (!applyLinkFromAnalytics()) loadMembers();
    </script>
  </body>
</html>
