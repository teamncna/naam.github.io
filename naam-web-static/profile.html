<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile — NAAM</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
    <script src="common.js"></script>
    <script src="theme.js"></script>
    <script src="nav.js"></script>
    <script src="photo-viewer.js"></script>
    <script src="ui.js"></script>
    <script>
      requireLogin();
    </script>
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container page-content">
      <section id="profile" class="profile-card">
        <div class="loading">Loading profile…</div>
      </section>
    </main>

    <div id="app-footer"></div>

    <script>
      renderHeader("profile");
      renderFooter();

      const userId = localStorage.getItem("userId");
      if (!userId) {
        location.href = "login.html";
      }

      const profileEl = document.getElementById("profile");

      // Keep same skipFields & prettyNames as your member page
      const skipFields = new Set([
        "photo_link",
        "photo_signed_url",
        "photo signed url",
        "Photo Signed URL",
        "photo_storage_path",
        "photo storage path",
        "Photo Storage Path",
        "photoSignedUrl",
        "photoStoragePath",
        "_id",
        "VerifiedByUser",
        "OnlyNameAndEmailOnline",
        "NoPictureInBook",
        "2016 lotto list",
        "AlternateSpouseUserName",
        "NoPictureOnline",
        "Publishing Options",
        "2015_update",
        "AlternateIdType",
        "EntireProfileInBook",
        "AlternateSpousePassword",
        "AlternatePassword",
        "Achi_name_first",
        "Admin Comment",
        "EntireProfileOnline",
        "AlternateSpouseIdType",
        "UserUpdated",
        "AlternateUserName",
        "OnlyNameAndEmailInBook",
        "Palakaram",
        "AdminUpdated",
        "Area",
      ]);

      const prettyNames = {
        "First name": "First Name",
        "Last name": "Last Name",
        "Chettinad native place": "Native Place",
        YearSince: "Year Since",
        Phone1: "Primary Phone",
        "Mobile number": "Mobile Number",
        "Spouse first name": "Spouse First Name",
        "Spouse last name": "Spouse Last Name",
        "Child 1 name": "Child 1",
        "Child 2 name": "Child 2",
        "Child 3 name": "Child 3",
        YearSince: "Year Moved to Bay Area",
        Pattapeyar: "House Name",
      };

      // Section groupings (same as member page)
      const basicInfoKeys = ["Email", "City"];
      const chettinadKeys = [
        "Chettinad native place",
        "Vilasam",
        "spouse birth villasam",
        "spouse birth vilasam",
        "Kovil",
        "Pirivu",
        "Kovil and Pirivu",
        "spouse kovil",
        "spouse native city",
      ];
      const contactKeys = ["Phone1", "Mobile number", "Address"];
      const familyKeys = [
        "Spouse first name",
        "Spouse last name",
        "Child 1 name",
        "Child 2 name",
        "Child 3 name",
      ];

      // Escape
      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }

      function renderFieldValue(key, value) {
        const text = String(value || "").trim();
        if (!text) return "N/A";

        const lowerKey = String(key || "").toLowerCase();
        if (lowerKey.includes("email")) {
          return `<a class="profile-link" href="mailto:${encodeURIComponent(
            text
          )}">${escapeHtml(text)}</a>`;
        }

        if (lowerKey.includes("phone") || lowerKey.includes("mobile")) {
          const tel = getTelHref(text);
          if (tel) {
            return `<a class="profile-link" href="${escapeHtml(
              tel
            )}">${escapeHtml(text)}</a>`;
          }
        }

        return escapeHtml(text);
      }

      function getTelHref(value) {
        const text = String(value || "").trim();
        const firstNumber = text.split(/[;/,|]/)[0] || text;
        const hasPlus = firstNumber.trim().startsWith("+");
        const digits = firstNumber.replace(/\D/g, "");
        if (digits.length < 7) return "";
        return `tel:${hasPlus ? "+" : ""}${digits}`;
      }

      function getFirstValue(member, keys) {
        for (const key of keys) {
          if (member[key]) return String(member[key]).trim();
        }
        return "";
      }

      function getMapsUrl(member) {
        const parts = [
          getFirstValue(member, ["Address", "Street Address", "Street"]),
          getFirstValue(member, ["City"]),
          getFirstValue(member, ["State", "Province"]),
          getFirstValue(member, ["Zip", "Zip Code", "Zipcode", "Postal Code"]),
        ].filter(Boolean);

        if (!parts.length) return "";
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
          parts.join(", ")
        )}`;
      }

      // Load
      async function loadProfile() {
        profileEl.innerHTML = `<div class="loading">Loading profile…</div>`;
        try {
          const res = await apiFetch(`/web/members/${encodeURIComponent(userId)}`);
          if (!res.ok) throw new Error("Profile not found");
          const m = await res.json();
          renderProfile(m);
        } catch (err) {
          console.error(err);
          profileEl.innerHTML = `<div class="error">Could not load profile.</div>`;
        }
      }

      // Render read-only view (same layout as member page)
      function renderProfile(m) {
        const fullname = `${m["First name"] || ""} ${
          m["Last name"] || ""
        }`.trim();
        const photoUrl = getPhotoUrl(m);

        function buildSection(keys, title) {
          const sectionHtml = keys
            .filter((key) => key in m && m[key] && !skipFields.has(key))
            .map(
              (key) => `
          <div>
            <strong>${escapeHtml(prettyNames[key] || key)}</strong>
            <div>${renderFieldValue(key, m[key])}</div>
          </div>`
            )
            .join("");

          return sectionHtml
            ? `<div class="profile-section">
              <h3>${escapeHtml(title)}</h3>
              <div class="profile-grid">${sectionHtml}</div>
            </div>`
            : "";
        }

        const groupedKeys = new Set([
          ...basicInfoKeys,
          ...chettinadKeys,
          ...contactKeys,
          ...familyKeys,
        ]);

        const miscHtml = Object.keys(m)
          .filter((key) => !skipFields.has(key) && !groupedKeys.has(key))
          .map(
            (key) => `
        <div>
          <strong>${escapeHtml(prettyNames[key] || key)}</strong>
          <div>${renderFieldValue(key, m[key])}</div>
        </div>`
          )
          .join("");
        const mapUrl = getMapsUrl(m);

        profileEl.innerHTML = `
    <div class="profile-top">
      <img class="profile-photo" src="${photoUrl}" onerror="this.src='assets/default-profile.jpeg'"/>
      <div class="profile-meta">
        <h2>${escapeHtml(fullname || m.Email || "Unnamed")}</h2>
        <div class="muted">${escapeHtml(m.City || "")}</div>
      </div>
    </div>

    ${buildSection(basicInfoKeys, "Basic Info")}
    ${buildSection(chettinadKeys, "Chettinad Info")}
    ${buildSection(contactKeys, "Contact Info")}
    ${buildSection(familyKeys, "Family")}
    ${
      miscHtml
        ? `<div class="profile-section">
            <h3>Other Details</h3>
            <div class="profile-grid">${miscHtml}</div>
          </div>`
        : ""
    }

    <div class="profile-bottom-photo">
      <div class="photo-viewer" id="photoViewer">
        <img class="banner-photo" src="${photoUrl}" onerror="this.src='assets/default-profile.jpeg'" />
      </div>
      <div class="photo-viewer-controls">
        <button type="button" class="btn subtle small" id="photoZoomOut">−</button>
        <button type="button" class="btn subtle small" id="photoZoomReset">Reset</button>
        <button type="button" class="btn subtle small" id="photoZoomIn">+</button>
      </div>
    </div>

    <div class="profile-actions">
      ${
        mapUrl
          ? `<a class="btn outline" href="${mapUrl}" target="_blank" rel="noopener">Map</a>`
          : ""
      }
      <button id="editBtn" class="btn outline">Edit Profile</button>
    </div>
  `;

        const viewer = initPhotoViewer(document.getElementById("photoViewer"));
        if (viewer) {
          document
            .getElementById("photoZoomIn")
            .addEventListener("click", viewer.zoomIn);
          document
            .getElementById("photoZoomOut")
            .addEventListener("click", viewer.zoomOut);
          document
            .getElementById("photoZoomReset")
            .addEventListener("click", viewer.reset);
        }

        document.getElementById("editBtn").addEventListener("click", () => {
          renderEditForm(m);
          // scroll to top of edit form
          window.scrollTo({ top: profileEl.offsetTop, behavior: "smooth" });
        });
      }

      // Render edit form for all visible fields except Email (non-editable)
      function renderEditForm(m) {
        const photoUrl = getPhotoUrl(m);
        // Collect all keys to show (same logic used for read-only)
        const groupedKeys = new Set([
          ...basicInfoKeys,
          ...chettinadKeys,
          ...contactKeys,
          ...familyKeys,
        ]);

        // Build ordered list: basic, chettinad, contact, family, then other keys
        const allVisibleKeys = [
          ...basicInfoKeys,
          ...chettinadKeys,
          ...contactKeys,
          ...familyKeys,
          // then other keys present in m but not skipped / grouped
          ...Object.keys(m).filter(
            (k) => !skipFields.has(k) && !groupedKeys.has(k)
          ),
        ];

        // Remove duplicates while preserving order
        const seen = new Set();
        const orderedKeys = allVisibleKeys.filter((k) => {
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });

        // Build HTML: for Email show read-only text; City gets a searchable
        // combobox (wired up after insertion); others show input fields.
        const fieldsHtml = orderedKeys
          .filter((k) => k in m && !skipFields.has(k))
          .map((key) => {
            if (key === "Email") {
              return `<div><strong>${escapeHtml(
                prettyNames[key] || key
              )}</strong><div>${renderFieldValue(key, m[key])}</div></div>`;
            }
            if (key === "City") {
              return `<div>
                <strong>${escapeHtml(prettyNames[key] || key)}</strong>
                <div class="combobox" id="cityCombobox">
                  <input class="edit-input combobox-input" type="text" id="cityInput" name="City" value="${escapeHtml(
                    m[key] || ""
                  )}" autocomplete="off" placeholder="Search for a city…" />
                  <div class="combobox-panel" id="cityPanel"></div>
                </div>
              </div>`;
            }
            // textarea for long fields (heuristic: if value length > 120 or value contains newline)
            const val = m[key] || "";
            const useTextarea =
              (typeof val === "string" && val.length > 120) ||
              (typeof val === "string" && val.includes("\n"));
            const inputName = escapeHtml(key);
            if (useTextarea) {
              return `<div>
                <strong>${escapeHtml(prettyNames[key] || key)}</strong>
                <textarea class="edit-input" name="${inputName}" rows="4">${escapeHtml(
                val
              )}</textarea>
              </div>`;
            } else {
              return `<div>
                <strong>${escapeHtml(prettyNames[key] || key)}</strong>
                <input class="edit-input" type="text" name="${inputName}" value="${escapeHtml(
                val
              )}" />
              </div>`;
            }
          })
          .join("");

        // Photo file input (single file controls profile/banner)
        const photoHtml = `
          <div>
            <strong>Profile Photo</strong>
            <div style="display:flex;gap:12px;align-items:center">
              <img src="${photoUrl}" class="profile-photo" style="width:72px;height:72px;border-radius:8px" onerror="this.src='assets/default-profile.jpeg'"/>
              <input type="file" id="photo_file" name="photo_file" accept="image/*" />
            </div>
          </div>
        `;

        profileEl.innerHTML = `
          <div class="profile-top">
            <img class="profile-photo" src="${photoUrl}" onerror="this.src='assets/default-profile.jpeg'"/>
            <div class="profile-meta">
              <h2>Edit Profile</h2>
              <div class="muted">${escapeHtml(m.City || "")}</div>
            </div>
          </div>

          <form id="editProfileForm">
            <div class="profile-section">
              <h3>Profile</h3>
              <div class="profile-grid">
                ${photoHtml}
                ${fieldsHtml}
              </div>
            </div>

            <div class="form-actions">
              <button type="button" id="saveBtn" class="btn">Save Changes</button>
              <button type="button" id="cancelBtn" class="btn outline">Cancel</button>
            </div>
          </form>
        `;

        document.getElementById("cancelBtn").addEventListener("click", () => {
          loadProfile();
        });

        document
          .getElementById("saveBtn")
          .addEventListener("click", async () => {
            await saveProfile(m);
          });

        initCityCombobox();
      }

      // Searchable city combobox: fetches distinct cities already in the
      // database from /stats/city so members pick an existing city instead
      // of retyping free text (which is how "Fremont" / "Fremont, CA" /
      // "fremont" ended up as separate values). If the typed value truly
      // isn't in the list, an "Add" option lets them create it after an
      // in-site confirmation (not a browser confirm()).
      // Mirrors the DB cleanup regex: strips a trailing standalone "CA"
      // (with or without a leading comma) so "Fremont, CA" / "Fremont CA"
      // normalize to "Fremont" before being compared or saved as new.
      function normalizeCityName(raw) {
        return String(raw || "")
          .trim()
          .replace(/[,\s]+ca\.?$/i, "")
          .trim();
      }

      async function initCityCombobox() {
        const wrapper = document.getElementById("cityCombobox");
        if (!wrapper) return;
        const input = document.getElementById("cityInput");
        const panel = document.getElementById("cityPanel");

        let cities = [];
        try {
          const res = await apiFetch("/stats/city");
          const stats = await res.json();
          cities = stats
            .map((item) => item._id)
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b));
        } catch (err) {
          console.error("Failed to load city list", err);
        }

        function renderOptions() {
          // Strip a trailing "CA"/", CA" before filtering/comparing so typing
          // "Fremont, CA" when "Fremont" already exists still surfaces the
          // existing option instead of showing "no matches" (the raw string
          // "fremont, ca" doesn't substring-match the clean "Fremont" entry) —
          // this is exactly how the city list fragmented in the first place.
          const normalizedCandidate = normalizeCityName(input.value);
          const query = normalizedCandidate.toLowerCase();
          const matches = query
            ? cities.filter((c) => c.toLowerCase().includes(query))
            : cities;

          const exactMatch = cities.some(
            (c) => c.toLowerCase() === query
          );

          let html = matches
            .slice(0, 50)
            .map(
              (c) =>
                `<div class="combobox-option" data-value="${escapeHtml(
                  c
                )}">${escapeHtml(c)}</div>`
            )
            .join("");

          if (normalizedCandidate && !exactMatch) {
            html += `<div class="combobox-option add-new" data-add="${escapeHtml(
              normalizedCandidate
            )}">+ Add "${escapeHtml(normalizedCandidate)}"</div>`;
          }

          panel.innerHTML =
            html || `<div class="combobox-option muted">No matches</div>`;
          panel.classList.add("open");
        }

        input.addEventListener("focus", renderOptions);
        input.addEventListener("input", renderOptions);

        panel.addEventListener("click", async (e) => {
          const option = e.target.closest(".combobox-option");
          if (!option) return;

          if (option.dataset.add) {
            const candidate = option.dataset.add;
            const confirmed = await showConfirmModal(
              `Are you sure <strong>"${escapeHtml(
                candidate
              )}"</strong> isn't already in the list under a different spelling? Only add it if it's really a new city.`,
              { confirmText: "Yes, add it", cancelText: "Cancel" }
            );
            if (confirmed) {
              input.value = candidate;
              cities.push(candidate);
              cities.sort((a, b) => a.localeCompare(b));
            }
            panel.classList.remove("open");
            return;
          }

          input.value = option.dataset.value;
          panel.classList.remove("open");
        });

        document.addEventListener("click", (e) => {
          if (!wrapper.contains(e.target)) panel.classList.remove("open");
        });
      }

      // Save: upload photo (if any) then PUT to backend
      async function saveProfile(originalMember) {
        const form = document.getElementById("editProfileForm");
        const formData = new FormData(form);

        try {
          // Handle photo upload if selected
          const fileInput = document.getElementById("photo_file");
          if (fileInput && fileInput.files && fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const uploadData = new FormData();
            uploadData.append("files", file);

            const uploadRes = await apiFetch("/upload", {
              method: "POST",
              body: uploadData,
            });

            const uploadJson = await uploadRes.json();
            if (uploadJson.files && uploadJson.files.length > 0) {
              formData.set("photo_link", uploadJson.files[0]);
            } else {
              alert("Photo upload failed. Profile not updated.");
              return;
            }
          }

          // Build plain object; exclude photo_file input and Email (non-editable)
          const plain = {};
          formData.forEach((v, k) => {
            if (k === "photo_file") return;
            // Email must not be changed
            if (k === "Email") return;
            plain[k] = v;
          });

          // Some fields might be missing: to avoid accidentally removing fields,
          // we only send keys that are present in plain (i.e. updated). The backend
          // should merge — if your backend needs full object, you can adjust here.
          const res = await apiFetch(`/web/members/${encodeURIComponent(userId)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(plain),
          });
          const data = await res.json().catch(() => ({}));

          // Trust the HTTP status, not a `data.ok` flag the backend doesn't
          // consistently set — it can respond 200 with a success message but
          // no `ok: true`, which previously showed as a false "update failed".
          if (res.ok) {
            alert("Profile updated!");
            // If backend returns updated member, use it; else reload from server
            if (data && data.member) renderProfile(data.member);
            else loadProfile();
          } else {
            console.error("Save failed", data);
            alert("Update failed: " + (data.message || `Server error (${res.status})`));
          }
        } catch (err) {
          console.error(err);
          alert("Error updating profile.");
        }
      }

      // init
      loadProfile();
    </script>
  </body>
</html>
