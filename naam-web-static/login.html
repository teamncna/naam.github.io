<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — NAAM</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
    <script src="common.js"></script>
    <script src="theme.js"></script>
  </head>
  <body class="login-page">
    <main class="container center-content">
      <div class="login-card">
        <img src="assets/logo.jpg" alt="NAAM" class="logo" />
        <h1 class="hero-title">Welcome to NCNA</h1>
        <p class="hero-lead">Please sign in with Google to continue.</p>
        <p class="hero-lead small-note">
          IMPORTANT: If your email is not approved as a NCNA member, you will
          not be allowed in. Please contact an admin to get access.
        </p>

        <div class="google-login">
          <button id="googleLoginBtn" class="btn">Sign in with Google</button>
        </div>

        <p id="loginMsg" class="muted small login-msg"></p>
      </div>
    </main>

    <script>
      async function verifySupabaseLogin() {
        const msg = document.getElementById("loginMsg");
        msg.textContent = "Verifying your account...";
        try {
          const session = await getSession();
          if (!session?.access_token) {
            localStorage.removeItem("userId");
            localStorage.removeItem("userEmail");
            localStorage.removeItem("userName");
            msg.textContent = "";
            return;
          }

          const data = await apiJson("/check-whitelist", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({}),
          });

          if (data.isWhitelisted) {
            const user = session.user;
            const member = data.member || {};
            localStorage.setItem("userId", member._id || "");
            localStorage.setItem("userEmail", user.email || "");
            localStorage.setItem(
              "userName",
              user.user_metadata?.full_name ||
                `${member["First name"] || ""} ${member["Last name"] || ""}`.trim()
            );
            msg.textContent = "Login successful! Redirecting...";
            msg.style.color = "var(--success)";
            setTimeout(() => (location.href = "landing.html"), 500);
          } else {
            await supabaseClient.auth.signOut();
            msg.textContent =
              "You are not authorized to access NAAM. Please contact the NCNA admin.";
            msg.style.color = "var(--danger)";
          }
        } catch (err) {
          console.error(err);
          if (err.status === 403) {
            await supabaseClient.auth.signOut();
            msg.textContent =
              "You are not authorized to access NAAM. Please contact the NCNA admin.";
          } else {
            msg.textContent = "Login verification failed. Please try again.";
          }
          msg.style.color = "var(--danger)";
        }
      }

      document
        .getElementById("googleLoginBtn")
        .addEventListener("click", async () => {
          const msg = document.getElementById("loginMsg");
          msg.textContent = "Opening Google sign in...";
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: window.location.href.split("#")[0].split("?")[0],
            },
          });

          if (error) {
            console.error(error);
            msg.textContent = "Could not start Google sign in.";
            msg.style.color = "var(--danger)";
          }
        });

      verifySupabaseLogin();
    </script>
  </body>
</html>
