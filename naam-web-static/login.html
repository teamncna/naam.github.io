<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — NAAM</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
    <script src="common.js"></script>
    <style>
      /* In styles.css or inside your <style> block */
      html,
      .login-page {
        min-height: 100vh; /* ensures it always fills the viewport */
        display: flex;
        align-items: center; /* optional, centers content vertically */
        justify-content: center; /* optional, centers content horizontally */
        background: linear-gradient(
            rgba(15, 23, 36, 0.65),
            rgba(15, 23, 36, 0.65)
          ),
          url("assets/bg-image.jpeg") center / cover no-repeat;
      }
    </style>
  </head>
  <body>
    <main class="container center-content login-page">
      <div class="hero-card login-card">
        <h1 class="hero-title">Welcome to NCNA</h1>
        <p class="lead hero-lead">Please sign in with Google to continue.</p>
        <p class="lead hero-lead small-note">
          IMPORTANT: If your email is not approved as a NCNA member, you will
          not be allowed in. Please contact an admin to get access.
        </p>

        <button id="googleLoginBtn" class="btn">Sign in with Google</button>

        <p id="loginMsg" class="muted small login-msg"></p>
      </div>
    </main>

    <script>
      async function verifySupabaseLogin() {
        const msg = document.getElementById("loginMsg");
        msg.textContent = "Verifying your account...";
        try {
          const session = await getSession();
          if (!session?.access_token) {
            localStorage.removeItem("userId");
            localStorage.removeItem("userEmail");
            localStorage.removeItem("userName");
            msg.textContent = "";
            return;
          }

          const data = await apiJson("/check-whitelist", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({}),
          });

          if (data.isWhitelisted) {
            const user = session.user;
            const member = data.member || {};
            localStorage.setItem("userId", member._id || "");
            localStorage.setItem("userEmail", user.email || "");
            localStorage.setItem(
              "userName",
              user.user_metadata?.full_name ||
                `${member["First name"] || ""} ${member["Last name"] || ""}`.trim()
            );
            msg.textContent = "Login successful! Redirecting...";
            msg.style.color = "var(--green)";
            setTimeout(() => (location.href = "landing.html"), 500);
          } else {
            await supabaseClient.auth.signOut();
            msg.textContent =
              data.message ||
              "Your email is not in the authorized member list.";
            msg.style.color = "var(--danger)";
          }
        } catch (err) {
          console.error(err);
          msg.textContent = "Login verification failed.";
          msg.style.color = "var(--danger)";
        }
      }

      document
        .getElementById("googleLoginBtn")
        .addEventListener("click", async () => {
          const msg = document.getElementById("loginMsg");
          msg.textContent = "Opening Google sign in...";
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: window.location.href.split("#")[0].split("?")[0],
            },
          });

          if (error) {
            console.error(error);
            msg.textContent = "Could not start Google sign in.";
            msg.style.color = "var(--danger)";
          }
        });

      verifySupabaseLogin();
    </script>
  </body>
</html>
