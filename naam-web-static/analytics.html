<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analytics — NAAM</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
    <script src="common.js"></script>
    <script src="theme.js"></script>
    <script src="nav.js"></script>
    <script>
      requireLogin();
    </script>
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container page-content">
      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Community Analytics</h2>
            <p class="muted small">Top breakdowns from the members database.</p>
          </div>
        </div>

        <div class="charts-grid">
          <div class="chart-card">
            <h4>Top Native Villages</h4>
            <canvas id="nativeChart" height="160"></canvas>
            <p class="chart-hint muted small">Click a slice to see those members</p>
          </div>

          <div class="chart-card">
            <h4>Top Cities</h4>
            <canvas id="cityChart" height="160"></canvas>
            <p class="chart-hint muted small">Click a slice to see those members</p>
          </div>

          <div class="chart-card wide">
            <h4>Top Kovils</h4>
            <canvas id="kovilChart" height="160"></canvas>
            <p class="chart-hint muted small">Click a slice to see those members</p>
          </div>

          <div class="chart-card wide">
            <h4>Year Since (spread)</h4>
            <canvas id="yearChart" height="160"></canvas>
            <p class="chart-hint muted small">Click a bar to see those members</p>
          </div>
        </div>
      </section>
    </main>

    <div id="app-footer"></div>

    <script>
      renderHeader("analytics");
      renderFooter();

      function isDarkTheme() {
        return document.documentElement.getAttribute("data-theme") !== "light";
      }

      Chart.defaults.color = isDarkTheme() ? "#B4A695" : "#6B5D50";
      Chart.defaults.borderColor = isDarkTheme()
        ? "rgba(214,178,122,0.16)"
        : "rgba(139,38,53,0.14)";

      async function loadAnalytics() {
        try {
          const res = await apiFetch("/analytics");
          const data = await res.json();
          drawChart("nativeChart", data.nativeVillage, "Chettinad native place");
          drawChart("cityChart", data.cityResidence, "City");
          drawChart("kovilChart", data.nagaraKovil, "Kovil");
          drawChart("yearChart", data.yearMoved, "YearSince", "bar");
        } catch (err) {
          console.error("Failed to load analytics", err);
          document.querySelector(".charts-grid").innerHTML =
            '<div class="error">Failed to load analytics</div>';
        }
      }

      // fieldKey matches the member field used by members.html's
      // category dropdown, so a chart slice can deep-link straight into it.
      function drawChart(canvasId, arr, fieldKey, type = "doughnut") {
        const labels = arr.map((a) => a.name || "Unknown");
        const counts = arr.map((a) => a.count || 0);
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;

        // Chettinad heritage palette — gold/maroon family with supporting hues
        const colors = [
          "#C9A24B",
          "#8B2635",
          "#4F9A6E",
          "#3C7A89",
          "#B4652E",
          "#7C6A46",
          "#A3475A",
          "#5B7A63",
          "#9C7A2E",
          "#6F5A8C",
          "#B08968",
          "#4A6670",
          "#8C5E3C",
          "#5C4A72",
        ];

        new Chart(ctx, {
          type,
          data: {
            labels,
            datasets: [
              {
                label: "Count",
                data: counts,
                backgroundColor: colors.slice(0, counts.length),
                borderColor: isDarkTheme() ? "#1D1815" : "#FFFFFF",
                borderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            onHover: (event, elements) => {
              event.native.target.style.cursor = elements.length
                ? "pointer"
                : "default";
            },
            onClick: (event, elements) => {
              if (!elements.length) return;
              const label = labels[elements[0].index];
              if (!label || label === "Unknown") return;
              location.href = `members.html?category=${encodeURIComponent(
                fieldKey
              )}&value=${encodeURIComponent(label)}`;
            },
            plugins: {
              legend: {
                position: type === "bar" ? "top" : "right",
                labels: {
                  boxWidth: 12,
                  font: {
                    size: 11,
                  },
                },
              },
            },
            scales:
              type === "bar"
                ? {
                    y: {
                      beginAtZero: true,
                      ticks: {
                        stepSize: 1,
                      },
                    },
                  }
                : {},
          },
        });
      }

      loadAnalytics();
    </script>
  </body>
</html>
