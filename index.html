<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NAAM — Namma Ooru</title>
    <link rel="icon" type="image/jpeg" href="naam-web-static/assets/logo.jpg" />
    <link rel="stylesheet" href="naam-web-static/styles.css" />
  </head>
  <body>
    <script>
      // Redirect logic: if logged in -> landing.html, else -> login.html
      const userId = localStorage.getItem("userId");
      const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
      const target = userId ? "naam-web-static/landing.html" : "naam-web-static/login.html";
      location.replace(base + target);
    </script>
  </body>
</html>
